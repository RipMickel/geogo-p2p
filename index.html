<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>GeoGO — Gather Together</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:#0b0f1a; --surface:#131929; --surface2:#1a2236;
      --border:rgba(255,255,255,0.08); --accent:#4ade80;
      --accent2:#60a5fa; --accent3:#f472b6; --text:#f0f4ff;
      --muted:#8899bb; --danger:#f87171; --host-color:#fbbf24;
      --r:18px; --rs:10px;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text)}

    #map{width:100%;height:100%;position:fixed;inset:0;z-index:0}

    /* MENU */
    #menu{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(ellipse at 60% 40%,#0d1f3c,#050810)}
    .stars{position:absolute;inset:0;pointer-events:none;
      background-image:
        radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.5),transparent),
        radial-gradient(1px 1px at 80% 10%,rgba(255,255,255,.4),transparent),
        radial-gradient(1px 1px at 50% 60%,rgba(255,255,255,.3),transparent),
        radial-gradient(1px 1px at 10% 80%,rgba(255,255,255,.4),transparent),
        radial-gradient(2px 2px at 35% 15%,rgba(255,255,255,.6),transparent),
        radial-gradient(1px 1px at 70% 85%,rgba(255,255,255,.3),transparent)}
    .menu-card{position:relative;width:340px;background:var(--surface);border:1px solid var(--border);
      border-radius:28px;padding:32px 28px;box-shadow:0 40px 80px rgba(0,0,0,.6);
      animation:slideUp .5s cubic-bezier(.34,1.56,.64,1) both}
    @keyframes slideUp{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
    .logo{text-align:center;margin-bottom:8px}
    .logo-icon{font-size:48px;display:block;margin-bottom:4px;animation:bounce 2s ease-in-out infinite}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .logo h1{font-size:36px;font-weight:900;letter-spacing:-1px;
      background:linear-gradient(135deg,var(--accent),var(--accent2) 60%,var(--accent3));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .logo p{color:var(--muted);font-size:13px;margin-top:4px}
    .divider{height:1px;background:var(--border);margin:20px 0}
    .field{margin-bottom:12px}
    .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      color:var(--muted);margin-bottom:6px}
    .field input{width:100%;padding:13px 16px;background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--rs);color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;
      font-weight:600;outline:none;transition:border-color .2s}
    .field input:focus{border-color:var(--accent2)}
    .field input::placeholder{color:var(--muted);font-weight:400}
    .btn-row{display:flex;gap:10px;margin-top:4px}
    .btn{flex:1;padding:14px;border-radius:var(--rs);border:none;font-family:'Nunito',sans-serif;
      font-size:14px;font-weight:800;cursor:pointer;transition:transform .12s,opacity .15s;letter-spacing:.02em}
    .btn:active{transform:scale(.96)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-create{background:linear-gradient(135deg,var(--accent),#22c55e);color:#052e10;
      box-shadow:0 4px 20px rgba(74,222,128,.35)}
    .btn-join{background:linear-gradient(135deg,var(--accent2),#3b82f6);color:#051533;
      box-shadow:0 4px 20px rgba(96,165,250,.3)}
    .room-display{margin-top:16px;background:var(--surface2);border:1px solid var(--border);
      border-radius:var(--rs);padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.7}
    .room-id{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;
      color:var(--accent);letter-spacing:.12em;display:block;margin-top:4px}

    /* HUD */
    .hud{position:fixed;z-index:900;pointer-events:none}
    .hud *{pointer-events:auto}

    #hud-info{top:12px;left:12px;background:rgba(11,15,26,.88);backdrop-filter:blur(12px);
      border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;min-width:185px;
      font-size:13px;line-height:1.9;display:none}
    .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.06em}
    .badge-host{background:var(--host-color);color:#1a0a00}
    .badge-player{background:var(--accent2);color:#020c1b}
    .info-row{display:flex;align-items:center;gap:6px}
    .info-label{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    .info-val{font-weight:700}

    #hud-exit{top:12px;right:12px;display:none}
    #exitBtn{background:rgba(248,113,113,.15);border:1px solid var(--danger);color:var(--danger);
      padding:10px 20px;border-radius:var(--rs);font-family:'Nunito',sans-serif;font-weight:800;
      font-size:13px;cursor:pointer;transition:background .15s}
    #exitBtn:hover{background:rgba(248,113,113,.28)}

    /* HOST EVENT BUTTON — bottom center */
    #hud-host-btn{bottom:16px;left:50%;transform:translateX(-50%);display:none}
    #pinEventBtn{
      background:linear-gradient(135deg,var(--host-color),#f59e0b);
      color:#1a0a00;border:none;padding:14px 30px;border-radius:50px;
      font-family:'Nunito',sans-serif;font-size:15px;font-weight:900;
      cursor:pointer;box-shadow:0 6px 28px rgba(251,191,36,.55);
      letter-spacing:.02em;transition:transform .12s,box-shadow .15s;
      display:flex;align-items:center;gap:8px;white-space:nowrap}
    #pinEventBtn:hover{box-shadow:0 8px 36px rgba(251,191,36,.75)}
    #pinEventBtn:active{transform:scale(.96)}

    /* CHAT */
    #hud-chat{bottom:12px;left:12px;width:min(300px,calc(100vw - 24px));display:none}
    .chat-box{background:rgba(11,15,26,.9);backdrop-filter:blur(12px);border:1px solid var(--border);
      border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
    .chat-header{padding:10px 14px;font-size:11px;font-weight:800;letter-spacing:.08em;
      text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:6px}
    .chat-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
      animation:blink 1.5s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    #chatMessages{height:150px;overflow-y:auto;padding:10px 14px;display:flex;
      flex-direction:column;gap:5px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
    .chat-msg{font-size:13px;line-height:1.5;animation:msgIn .2s ease both}
    @keyframes msgIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
    .chat-msg .msg-name{font-weight:800}
    .chat-msg.system{color:var(--muted);font-style:italic;font-size:12px}
    .chat-input-row{display:flex;border-top:1px solid var(--border)}
    #chatInput{flex:1;background:transparent;border:none;padding:11px 14px;color:var(--text);
      font-family:'Nunito',sans-serif;font-size:13px;outline:none}
    #chatInput::placeholder{color:var(--muted)}
    #chatSend{background:var(--accent2);border:none;color:#020c1b;padding:0 14px;
      font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;cursor:pointer}

    /* NOTIFICATIONS */
    #hud-notify{bottom:80px;right:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
    .notify{background:rgba(11,15,26,.94);backdrop-filter:blur(12px);border:1px solid var(--border);
      border-radius:var(--rs);padding:10px 16px;font-size:13px;font-weight:700;max-width:240px;
      animation:notifyIn .3s cubic-bezier(.34,1.56,.64,1) both,notifyOut .3s ease forwards 4s}
    @keyframes notifyIn{from{opacity:0;transform:translateX(20px) scale(.9)}to{opacity:1;transform:translateX(0) scale(1)}}
    @keyframes notifyOut{to{opacity:0;transform:translateX(20px) scale(.9)}}

    /* PLAYER MARKERS */
    .player-icon-wrapper{position:relative;width:24px;height:24px;cursor:pointer}
    .player-pulse{position:absolute;width:56px;height:56px;border-radius:50%;top:50%;left:50%;
      transform:translate(-50%,-50%) scale(.4);opacity:.7;animation:playerPulse 2s ease-out infinite}
    .player-dot{position:absolute;width:22px;height:22px;border-radius:50%;top:50%;left:50%;
      transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);
      box-shadow:0 0 12px rgba(255,255,255,.6)}
    .player-crown{position:absolute;font-size:13px;top:-20px;left:50%;transform:translateX(-50%);
      animation:crownFloat 2s ease-in-out infinite}
    @keyframes playerPulse{0%{transform:translate(-50%,-50%) scale(.4);opacity:.7}100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
    @keyframes crownFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}

    /* EVENT PIN MARKERS */
    .event-pin-wrapper{position:relative;width:44px;height:44px}
    .event-pin-pulse{position:absolute;width:80px;height:80px;border-radius:50%;top:50%;left:50%;
      transform:translate(-50%,-50%) scale(.3);animation:evPulse 2.4s ease-out infinite}
    @keyframes evPulse{0%{transform:translate(-50%,-50%) scale(.3);opacity:.9}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
    .event-pin-body{position:absolute;width:40px;height:40px;
      border-radius:50% 50% 50% 0;
      top:50%;left:50%;
      transform:translate(-50%,-65%) rotate(-45deg);
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 20px rgba(0,0,0,.45);
      animation:pinBob 2.5s ease-in-out infinite}
    .pin-inner{transform:rotate(45deg);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
    @keyframes pinBob{0%,100%{transform:translate(-50%,-65%) rotate(-45deg) translateY(0)}
      50%{transform:translate(-50%,-65%) rotate(-45deg) translateY(-4px)}}

    /* EVENT MODAL */
    #eventModal{position:fixed;inset:0;z-index:9000;display:none;align-items:flex-end;
      justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);padding-bottom:20px}
    #eventModal.open{display:flex}
    .event-sheet{width:min(440px,100vw - 20px);background:var(--surface);border:1px solid var(--border);
      border-radius:24px 24px 20px 20px;padding:24px 22px 20px;
      box-shadow:0 -20px 60px rgba(0,0,0,.5);
      animation:sheetUp .35s cubic-bezier(.34,1.56,.64,1) both;max-height:90vh;overflow-y:auto}
    @keyframes sheetUp{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}
    .sheet-title{font-size:17px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .event-types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
    .etype{background:var(--surface2);border:2px solid var(--border);border-radius:14px;
      padding:12px 6px;cursor:pointer;text-align:center;transition:border-color .15s,background .15s;
      font-size:11px;font-weight:800;line-height:1.5;color:var(--text)}
    .etype .ei{font-size:26px;display:block;margin-bottom:4px}
    .etype:hover,.etype.selected{border-color:var(--host-color);background:rgba(251,191,36,.1);color:var(--host-color)}
    .sheet-field{margin-bottom:12px}
    .sheet-field label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;
      text-transform:uppercase;color:var(--muted);margin-bottom:6px}
    .sheet-field input,.sheet-field textarea{width:100%;padding:12px 14px;background:var(--surface2);
      border:1.5px solid var(--border);border-radius:var(--rs);color:var(--text);
      font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;outline:none;
      resize:none;transition:border-color .2s}
    .sheet-field input:focus,.sheet-field textarea:focus{border-color:var(--host-color)}
    .sheet-field input::placeholder,.sheet-field textarea::placeholder{color:var(--muted);font-weight:400}
    .pick-btn{width:100%;padding:12px;background:rgba(251,191,36,.08);
      border:1.5px dashed rgba(251,191,36,.4);border-radius:var(--rs);
      color:var(--host-color);font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;
      cursor:pointer;text-align:center;transition:background .15s;margin-bottom:14px}
    .pick-btn:hover{background:rgba(251,191,36,.16)}
    .pick-btn.picked{border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08);color:var(--accent)}
    .sheet-actions{display:flex;gap:10px}
    .btn-cancel{flex:1;padding:13px;border-radius:var(--rs);border:1px solid var(--border);
      background:transparent;color:var(--muted);font-family:'Nunito',sans-serif;
      font-weight:700;font-size:14px;cursor:pointer;transition:background .15s}
    .btn-cancel:hover{background:var(--surface2)}
    .btn-pin{flex:2;padding:13px;border-radius:var(--rs);border:none;
      background:linear-gradient(135deg,var(--host-color),#f59e0b);color:#1a0a00;
      font-family:'Nunito',sans-serif;font-weight:900;font-size:14px;cursor:pointer;
      box-shadow:0 4px 16px rgba(251,191,36,.35);transition:opacity .15s}
    .btn-pin:disabled{opacity:.35;cursor:not-allowed}

    /* PICKING MODE */
    #pickingHint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      z-index:9500;pointer-events:none;background:rgba(11,15,26,.92);backdrop-filter:blur(10px);
      border:2px solid var(--host-color);border-radius:var(--r);
      padding:20px 32px;text-align:center;display:none}
    #pickingHint .ph-icon{font-size:36px;display:block;margin-bottom:8px;
      animation:bounce 1.2s ease-in-out infinite}
    #pickingHint p{font-size:15px;font-weight:800;color:var(--host-color)}
    #pickingHint small{color:var(--muted);font-size:12px}
    body.picking #map{cursor:crosshair!important}

    /* LEAFLET */
    .leaflet-popup-content-wrapper{background:var(--surface)!important;border:1px solid var(--border)!important;
      border-radius:14px!important;box-shadow:0 10px 30px rgba(0,0,0,.5)!important;color:var(--text)!important}
    .leaflet-popup-tip{background:var(--surface)!important}
    .leaflet-popup-content{font-family:'Nunito',sans-serif!important;font-size:13px!important;
      font-weight:600!important;text-align:center;line-height:1.7!important;margin:12px 16px!important}
    .leaflet-control-zoom a{background:rgba(11,15,26,.85)!important;color:var(--text)!important;
      border-color:var(--border)!important;backdrop-filter:blur(8px)}
    .leaflet-control-zoom a:hover{background:var(--surface2)!important}
    .leaflet-control-attribution{background:rgba(11,15,26,.7)!important;color:var(--muted)!important;
      backdrop-filter:blur(6px);font-size:9px!important}
    .leaflet-control-attribution a{color:var(--accent2)!important}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
  </style>
</head>
<body>

<!-- MAP -->
<div id="map"></div>

<!-- MENU -->
<div id="menu">
  <div class="stars"></div>
  <div class="menu-card">
    <div class="logo">
      <span class="logo-icon">🌍</span>
      <h1>GeoGO</h1>
      <p>Real-world multiplayer event map</p>
    </div>
    <div class="divider"></div>
    <div class="field">
      <label>Your Nickname</label>
      <input id="nickname" placeholder="Enter nickname…" maxlength="20" autocomplete="off"/>
    </div>
    <div class="field">
      <label>Room ID <span style="font-weight:400;text-transform:none;font-size:10px">(leave blank to create)</span></label>
      <input id="roomInput" placeholder="e.g. ABC123" maxlength="10" autocomplete="off"
        style="text-transform:uppercase;letter-spacing:.1em;font-family:'Space Mono',monospace"/>
    </div>
    <div class="btn-row">
      <button class="btn btn-create" id="createBtn">✦ Create</button>
      <button class="btn btn-join"   id="joinBtn">→ Join</button>
    </div>
    <div class="room-display" id="roomDisplay">Enter a nickname and create or join a room.</div>
  </div>
</div>

<!-- HUD: INFO -->
<div class="hud" id="hud-info" style="display:none">
  <div class="info-row" style="margin-bottom:4px">
    <span id="roleBadge" class="badge badge-host">HOST 👑</span>
  </div>
  <div class="info-row">
    <span class="info-label">Room</span>
    <span class="info-val" id="infoRoom"
      style="font-family:'Space Mono',monospace;color:var(--accent);letter-spacing:.1em">-</span>
  </div>
  <div class="info-row">
    <span class="info-label">Players</span>
    <span class="info-val" id="infoPlayers">1</span>
  </div>
  <div class="info-row">
    <span class="info-label">Events</span>
    <span class="info-val" id="infoEvents">0</span>
  </div>
</div>

<!-- HUD: EXIT -->
<div class="hud" id="hud-exit" style="display:none">
  <button id="exitBtn">✕ Exit</button>
</div>

<!-- HUD: PIN BUTTON (host only, bottom-center) -->
<div class="hud" id="hud-host-btn" style="display:none">
  <button id="pinEventBtn">📍 Pin Event</button>
</div>

<!-- HUD: CHAT -->
<div class="hud" id="hud-chat" style="display:none">
  <div class="chat-box">
    <div class="chat-header"><div class="chat-dot"></div> Live Chat</div>
    <div id="chatMessages"></div>
    <div class="chat-input-row">
      <input id="chatInput" placeholder="Say something…" maxlength="120" autocomplete="off"/>
      <button id="chatSend">Send</button>
    </div>
  </div>
</div>

<!-- HUD: NOTIFICATIONS -->
<div class="hud" id="hud-notify"></div>

<!-- PICKING HINT OVERLAY -->
<div id="pickingHint">
  <span class="ph-icon">📍</span>
  <p>Tap anywhere on the map</p>
  <small>to drop your event pin</small>
</div>

<!-- EVENT MODAL (host only) -->
<div id="eventModal">
  <div class="event-sheet">
    <div class="sheet-title">📍 Create an Event</div>

    <div class="event-types" id="eventTypes">
      <div class="etype selected" data-type="gather"   data-icon="🤝"><span class="ei">🤝</span>Gather Here</div>
      <div class="etype"          data-type="treeplant" data-icon="🌱"><span class="ei">🌱</span>Tree Planting</div>
      <div class="etype"          data-type="cleanup"  data-icon="🧹"><span class="ei">🧹</span>Clean-Up Drive</div>
      <div class="etype"          data-type="relief"   data-icon="📦"><span class="ei">📦</span>Relief Ops</div>
      <div class="etype"          data-type="medical"  data-icon="🏥"><span class="ei">🏥</span>Medical Aid</div>
      <div class="etype"          data-type="custom"   data-icon="✏️"><span class="ei">✏️</span>Custom</div>
    </div>

    <div class="sheet-field" id="customWrap" style="display:none">
      <label>Custom Event Name</label>
      <input id="customLabel" placeholder="e.g. Feeding Program…" maxlength="40"/>
    </div>

    <div class="sheet-field">
      <label>Description <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <textarea id="eventDesc" rows="2" placeholder="Add details for your team…"></textarea>
    </div>

    <button class="pick-btn" id="pickLocBtn">🗺️ Tap to pick a location on the map</button>

    <div class="sheet-actions">
      <button class="btn-cancel" id="cancelEventBtn">Cancel</button>
      <button class="btn-pin"    id="confirmPinBtn" disabled>📍 Pin It</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════
//  GeoGO — Multiplayer Real-World Event Map
// ═══════════════════════════════════════════════════════

/* ── MAP ── */
const map = L.map('map', { zoomControl: true }).setView([14.5995, 120.9842], 16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 20,
}).addTo(map);

/* ── DOM ── */
const $ = id => document.getElementById(id);
const menu          = $('menu');
const nicknameEl    = $('nickname');
const roomInputEl   = $('roomInput');
const createBtn     = $('createBtn');
const joinBtn       = $('joinBtn');
const roomDisplay   = $('roomDisplay');
const hudInfo       = $('hud-info');
const hudExit       = $('hud-exit');
const hudChat       = $('hud-chat');
const hudHostBtn    = $('hud-host-btn');
const hudNotify     = $('hud-notify');
const exitBtn       = $('exitBtn');
const roleBadge     = $('roleBadge');
const infoRoom      = $('infoRoom');
const infoPlayers   = $('infoPlayers');
const infoEvents    = $('infoEvents');
const chatMessages  = $('chatMessages');
const chatInput     = $('chatInput');
const chatSend      = $('chatSend');
const pinEventBtn   = $('pinEventBtn');
const eventModal    = $('eventModal');
const cancelEventBtn= $('cancelEventBtn');
const confirmPinBtn = $('confirmPinBtn');
const pickLocBtn    = $('pickLocBtn');
const pickingHint   = $('pickingHint');
const eventTypesEl  = $('eventTypes');
const customWrap    = $('customWrap');
const customLabelEl = $('customLabel');
const eventDescEl   = $('eventDesc');

/* ── STATE ── */
let nickname = '', myColor = '', roomId = '';
let isHost = false, peer = null, watchId = null;
let myMarker = null, myLat = null, myLng = null;
const peers      = {};   // peerId → { conn, marker, data }
const connections= [];
const seenMsgIds = new Set();
const events     = {};   // evId → { marker, data }

/* ── MODAL STATE ── */
let selType = 'gather', selIcon = '🤝';
let pickedLat = null, pickedLng = null;
let pickingMode = false;

/* ── COLORS ── */
const PLAYER_COLORS = ['#4ade80','#60a5fa','#f472b6','#fb923c','#a78bfa','#34d399','#facc15','#f87171'];
const EVENT_COLORS  = { gather:'#fbbf24', treeplant:'#4ade80', cleanup:'#60a5fa',
                        relief:'#fb923c',  medical:'#f87171',  custom:'#c084fc' };
function pickColor(){ return PLAYER_COLORS[Math.floor(Math.random()*PLAYER_COLORS.length)]; }

/* ── UTILS ── */
function uid(){ return Math.random().toString(36).substring(2,10); }
function genRoomId(){ return Math.random().toString(36).substring(2,8).toUpperCase(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── NOTIFY ── */
function notify(msg){
  const el = document.createElement('div');
  el.className = 'notify'; el.innerHTML = msg;
  hudNotify.appendChild(el);
  setTimeout(()=>el.remove(), 4500);
}

/* ── CHAT ── */
function addChat(name, text, sys=false){
  const div = document.createElement('div');
  div.className = sys ? 'chat-msg system' : 'chat-msg';
  if(sys){ div.textContent = text; }
  else {
    const col = name===nickname ? myColor : (Object.values(peers).find(p=>p.data?.nickname===name)?.data?.color || 'var(--muted)');
    div.innerHTML = `<span class="msg-name" style="color:${col}">${esc(name)}:</span> ${esc(text)}`;
  }
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

chatSend.onclick = ()=>{ if(chatInput.value.trim()){ sendChat(chatInput.value); chatInput.value=''; } };
chatInput.addEventListener('keydown', e=>{ if(e.key==='Enter' && chatInput.value.trim()){ sendChat(chatInput.value); chatInput.value=''; } });

function sendChat(text){
  const msg = { type:'chat', msgId:uid(), nickname, text:text.trim() };
  addChat(nickname, text.trim());
  broadcast(msg);
}

/* ── COUNTS ── */
function updatePlayerCount(){ infoPlayers.textContent = 1 + Object.keys(peers).length; }
function updateEventCount() { infoEvents.textContent  = Object.keys(events).length; }

/* ── SHOW HUD ── */
function showHUD(){
  menu.style.display = 'none';
  hudInfo.style.display = 'block';
  hudExit.style.display = 'block';
  hudChat.style.display = 'block';
  if(isHost) hudHostBtn.style.display = 'block';
}

/* ── PLAYER ICON ── */
function makePlayerIcon(color, host){
  return L.divIcon({
    className:'',
    html:`<div class="player-icon-wrapper">
      ${host?'<div class="player-crown">👑</div>':''}
      <div class="player-pulse" style="background:${color}"></div>
      <div class="player-dot"   style="background:${color}"></div>
    </div>`,
    iconSize:[24,24], iconAnchor:[12,12], popupAnchor:[0,-28],
  });
}

/* ── EVENT ICON ── */
function makeEventIcon(icon, type){
  const col = EVENT_COLORS[type]||'#c084fc';
  return L.divIcon({
    className:'',
    html:`<div class="event-pin-wrapper">
      <div class="event-pin-pulse" style="background:${col}55"></div>
      <div class="event-pin-body"  style="background:${col}">
        <div class="pin-inner">${icon}</div>
      </div>
    </div>`,
    iconSize:[44,44], iconAnchor:[22,44], popupAnchor:[0,-48],
  });
}

/* ── PLACE EVENT ── */
function placeEvent(evId, data){
  if(events[evId]) return;
  const col = EVENT_COLORS[data.eventType]||'#c084fc';
  const removeBtn = isHost
    ? `<br><button onclick="removeEvent('${evId}')"
        style="margin-top:8px;background:rgba(248,113,113,.15);border:1px solid #f87171;
        color:#f87171;padding:5px 14px;border-radius:8px;cursor:pointer;
        font-family:'Nunito',sans-serif;font-weight:800;font-size:12px">✕ Remove</button>`
    : '';
  const marker = L.marker([data.lat,data.lng],{ icon:makeEventIcon(data.icon,data.eventType) })
    .addTo(map)
    .bindPopup(`
      <div style="font-size:15px;font-weight:900">${data.icon} ${esc(data.label)}</div>
      ${data.desc ? `<div style="color:var(--muted);margin-top:4px">${esc(data.desc)}</div>` : ''}
      <div style="color:${col};font-size:12px;margin-top:4px">📍 Pinned by ${esc(data.pinned_by)}</div>
      ${removeBtn}
    `);
  events[evId] = { marker, data };
  updateEventCount();
}

function removeEvent(evId){
  if(!events[evId]) return;
  const label = events[evId].data.label;
  map.removeLayer(events[evId].marker);
  delete events[evId];
  map.closePopup();
  updateEventCount();
  if(isHost){
    broadcast({ type:'event_remove', evId });
    addChat('', `📍 Event "${label}" removed.`, true);
  }
}
window.removeEvent = removeEvent; // exposed for popup button onclick

/* ── PLAYER MARKERS ── */
function upsertMyMarker(lat,lng){
  map.setView([lat,lng], map.getZoom());
  const icon = makePlayerIcon(myColor,isHost);
  if(!myMarker){
    myMarker = L.marker([lat,lng],{icon,zIndexOffset:1000}).addTo(map)
      .bindPopup(`<b style="color:${myColor}">${esc(nickname)}</b><br>${isHost?'👑 Host':'👤 Player'}<br><i style="color:var(--muted)">You</i>`);
  } else { myMarker.setLatLng([lat,lng]); myMarker.setIcon(icon); }
}

function upsertPeerMarker(peerId,data){
  const icon = makePlayerIcon(data.color,data.isHost);
  const popup = `<b style="color:${data.color}">${esc(data.nickname)}</b><br>${data.isHost?'👑 Host':'👤 Player'}`;
  if(!peers[peerId]){
    peers[peerId]={ conn:null, data,
      marker: L.marker([data.lat,data.lng],{icon}).addTo(map).bindPopup(popup) };
  } else {
    peers[peerId].data = data;
    if(!peers[peerId].marker){
      peers[peerId].marker = L.marker([data.lat,data.lng],{icon}).addTo(map).bindPopup(popup);
    } else {
      peers[peerId].marker.setLatLng([data.lat,data.lng]);
      peers[peerId].marker.setIcon(icon);
    }
  }
}

function removePeer(peerId){
  if(!peers[peerId]) return;
  if(peers[peerId].marker) map.removeLayer(peers[peerId].marker);
  const name = peers[peerId].data?.nickname || peerId;
  delete peers[peerId];
  addChat('', `${name} left ❌`, true);
  notify(`${name} left ❌`);
  updatePlayerCount();
}

/* ── BROADCAST / RELAY ── */
function broadcast(data){
  for(const p of Object.values(peers)){
    if(p.conn?.open){ try{ p.conn.send(data); }catch(e){} }
  }
}

function relayExcept(data, skip){
  for(const p of Object.values(peers)){
    if(p.conn && p.conn!==skip && p.conn.open){ try{ p.conn.send(data); }catch(e){} }
  }
}

/* ── MESSAGE HANDLER ── */
function handleMessage(data, fromConn){
  if(!data?.type) return;
  switch(data.type){

    case 'position':
      if(data.peerId===peer?.id) return;
      upsertPeerMarker(data.peerId, data);
      updatePlayerCount();
      if(isHost) relayExcept(data, fromConn);
      break;

    case 'chat':
      if(seenMsgIds.has(data.msgId)) return;
      seenMsgIds.add(data.msgId);
      if(data.nickname!==nickname) addChat(data.nickname, data.text);
      if(isHost) relayExcept(data, fromConn);
      break;

    case 'join_notify':
      if(seenMsgIds.has(data.msgId)) return;
      seenMsgIds.add(data.msgId);
      if(data.nickname!==nickname){
        addChat('', `${data.nickname} joined 🎮`, true);
        notify(`${data.nickname} joined 🎮`);
      }
      if(isHost) relayExcept(data, fromConn);
      break;

    case 'event_pin':
      if(!events[data.evId]){
        placeEvent(data.evId, data);
        if(data.pinned_by!==nickname){
          notify(`📍 New event: ${data.icon} ${data.label}`);
          addChat('', `📍 ${data.pinned_by} pinned "${data.label}"`, true);
        }
      }
      if(isHost) relayExcept(data, fromConn);
      break;

    case 'event_remove':
      if(events[data.evId]){
        const lbl = events[data.evId].data.label;
        map.removeLayer(events[data.evId].marker);
        delete events[data.evId];
        map.closePopup();
        updateEventCount();
        addChat('', `📍 Event "${lbl}" removed by host.`, true);
      }
      break;

    case 'full_state':
      if(data.players){
        for(const [pid,pd] of Object.entries(data.players))
          if(pid!==peer?.id) upsertPeerMarker(pid,pd);
        updatePlayerCount();
      }
      if(data.events){
        for(const [eid,ed] of Object.entries(data.events)) placeEvent(eid,ed);
      }
      break;
  }
}

/* ── CONNECTION SETUP ── */
function setupConn(conn){
  const peerId = conn.peer;
  if(!peers[peerId]) peers[peerId]={ conn, marker:null, data:null };
  else peers[peerId].conn = conn;

  conn.on('data',  d  => handleMessage(d, conn));
  conn.on('close', () => removePeer(peerId));
  conn.on('error', () => removePeer(peerId));

  if(isHost){
    // Build snapshot of current players & events for new joiner
    const playerSnap={}, eventSnap={};
    for(const [pid,p] of Object.entries(peers)) if(p.data && pid!==peerId) playerSnap[pid]=p.data;
    if(myLat!==null) playerSnap[peer.id]={ type:'position',peerId:peer.id,nickname,color:myColor,lat:myLat,lng:myLng,isHost:true };
    for(const [eid,ev] of Object.entries(events)) eventSnap[eid]=ev.data;
    setTimeout(()=>{ if(conn.open) conn.send({ type:'full_state',players:playerSnap,events:eventSnap }); }, 800);
  }
}

/* ── GPS ── */
function startGPS(){
  if(!navigator.geolocation){ alert('Geolocation not supported'); return; }
  watchId = navigator.geolocation.watchPosition(pos=>{
    myLat=pos.coords.latitude; myLng=pos.coords.longitude;
    upsertMyMarker(myLat, myLng);
    broadcast({ type:'position',peerId:peer.id,nickname,color:myColor,lat:myLat,lng:myLng,isHost });
  }, err=>{
    console.warn(err);
    if(myLat===null){ myLat=14.5995; myLng=120.9842; upsertMyMarker(myLat,myLng); notify('📍 GPS unavailable — using default location'); }
  }, { enableHighAccuracy:true, maximumAge:2000, timeout:10000 });
}

/* ── HOST ── */
function startHost(){
  peer = new Peer(roomId, { debug:0 });
  peer.on('open', ()=>{
    isHost=true;
    roleBadge.textContent='HOST 👑'; roleBadge.className='badge badge-host';
    infoRoom.textContent=roomId;
    showHUD(); startGPS();
  });
  peer.on('connection', conn=>{
    connections.push(conn);
    setupConn(conn);
    setTimeout(()=>{
      if(peers[conn.peer]?.data){
        const name=peers[conn.peer].data.nickname;
        const jmsg={ type:'join_notify',msgId:uid(),nickname:name };
        addChat('',`${name} joined 🎮`,true);
        notify(`${name} joined 🎮`);
        relayExcept(jmsg, conn);
      }
    }, 1500);
  });
  peer.on('error', e=>{
    if(e.type==='unavailable-id'){
      roomId=genRoomId();
      roomDisplay.innerHTML=`ID taken, new room:<br><span class="room-id">${roomId}</span>`;
      startHost();
    } else console.error(e);
  });
}

/* ── CLIENT ── */
function startClient(){
  peer = new Peer(undefined, { debug:0 });
  peer.on('open', ()=>{
    const conn = peer.connect(roomId, { reliable:true });
    connections.push(conn);
    conn.on('open', ()=>{
      setupConn(conn);
      roleBadge.textContent='PLAYER 👤'; roleBadge.className='badge badge-player';
      infoRoom.textContent=roomId;
      showHUD(); startGPS();
      broadcast({ type:'join_notify',msgId:uid(),nickname });
    });
    conn.on('error', ()=>{ alert('Could not connect. Check the Room ID.'); location.reload(); });
  });
  peer.on('error', e=>{ alert('Error: '+e.type); console.error(e); });
}

/* ── MENU ── */
createBtn.onclick = ()=>{
  nickname=nicknameEl.value.trim();
  if(!nickname){ nicknameEl.focus(); return; }
  myColor=pickColor(); roomId=genRoomId();
  roomDisplay.innerHTML=`Room created! Share this ID:<br><span class="room-id">${roomId}</span>`;
  createBtn.disabled=true; joinBtn.disabled=true;
  startHost();
};
joinBtn.onclick = ()=>{
  nickname=nicknameEl.value.trim();
  roomId=roomInputEl.value.trim().toUpperCase();
  if(!nickname){ nicknameEl.focus(); return; }
  if(!roomId)  { roomInputEl.focus(); return; }
  myColor=pickColor();
  roomDisplay.innerHTML=`Connecting to <span class="room-id">${roomId}</span>…`;
  createBtn.disabled=true; joinBtn.disabled=true;
  startClient();
};
nicknameEl.addEventListener('keydown', e=>{ if(e.key==='Enter') roomInputEl.focus(); });
roomInputEl.addEventListener('keydown',e=>{ if(e.key==='Enter') joinBtn.click(); });
roomInputEl.addEventListener('input',  ()=>{ roomInputEl.value=roomInputEl.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });

/* ── EXIT ── */
exitBtn.onclick = ()=>{
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  if(peer) peer.destroy();
  location.reload();
};

/* ══════════════════════════════════════════
   EVENT PINNING  (host only)
══════════════════════════════════════════ */

function resetModal(){
  pickedLat=null; pickedLng=null;
  confirmPinBtn.disabled=true;
  pickLocBtn.textContent='🗺️ Tap to pick a location on the map';
  pickLocBtn.classList.remove('picked');
  eventDescEl.value=''; customLabelEl.value='';
  document.querySelectorAll('.etype').forEach(el=>el.classList.remove('selected'));
  document.querySelector('.etype[data-type="gather"]').classList.add('selected');
  selType='gather'; selIcon='🤝';
  customWrap.style.display='none';
}

pinEventBtn.onclick = ()=>{ resetModal(); eventModal.classList.add('open'); };

cancelEventBtn.onclick = ()=>{ eventModal.classList.remove('open'); exitPickMode(); };
eventModal.addEventListener('click', e=>{ if(e.target===eventModal){ eventModal.classList.remove('open'); exitPickMode(); } });

/* Type selection */
eventTypesEl.addEventListener('click', e=>{
  const card=e.target.closest('.etype');
  if(!card) return;
  document.querySelectorAll('.etype').forEach(el=>el.classList.remove('selected'));
  card.classList.add('selected');
  selType=card.dataset.type; selIcon=card.dataset.icon;
  customWrap.style.display = selType==='custom' ? 'block' : 'none';
});

/* Pick location on map */
pickLocBtn.onclick = ()=>{
  eventModal.classList.remove('open');
  enterPickMode();
};

function enterPickMode(){
  pickingMode=true;
  document.body.classList.add('picking');
  pickingHint.style.display='block';
}
function exitPickMode(){
  pickingMode=false;
  document.body.classList.remove('picking');
  pickingHint.style.display='none';
}

map.on('click', e=>{
  if(!pickingMode) return;
  pickedLat=e.latlng.lat; pickedLng=e.latlng.lng;
  exitPickMode();
  pickLocBtn.textContent=`✅ ${pickedLat.toFixed(5)}, ${pickedLng.toFixed(5)}`;
  pickLocBtn.classList.add('picked');
  confirmPinBtn.disabled=false;
  eventModal.classList.add('open');
});

/* Confirm and broadcast event */
confirmPinBtn.onclick = ()=>{
  if(pickedLat===null) return;

  const typeEl = document.querySelector(`.etype[data-type="${selType}"]`);
  const label  = selType==='custom'
    ? (customLabelEl.value.trim() || 'Custom Event')
    : typeEl.textContent.trim();

  const evId   = uid();
  const evData = {
    type:'event_pin', evId,
    eventType: selType,
    icon:      selIcon,
    label,
    desc:      eventDescEl.value.trim(),
    lat:       pickedLat,
    lng:       pickedLng,
    pinned_by: nickname,
  };

  placeEvent(evId, evData);
  map.setView([pickedLat,pickedLng], Math.max(map.getZoom(),16));
  broadcast(evData);

  addChat('', `📍 You pinned "${label}"`, true);
  notify(`📍 Event pinned: ${selIcon} ${label}`);
  eventModal.classList.remove('open');
};

/* ── CLEANUP ── */
window.addEventListener('beforeunload', ()=>{
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  if(peer) peer.destroy();
});
</script>
