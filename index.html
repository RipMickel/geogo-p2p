<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GeoGO Multiplayer</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111827;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .menu {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, #0f172a, #111827);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .card {
      width: 320px;
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .card h1 {
      margin-bottom: 12px;
      font-size: 28px;
      color: #111827;
    }

    .card p {
      margin-bottom: 20px;
      color: #555;
    }

    .card input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      margin-bottom: 14px;
      font-size: 16px;
    }

    .card button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .status {
      position: fixed;
      top: 82px;
      left: 12px;
      z-index: 999;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      min-width: 220px;
      line-height: 1.8;
    }

    .room-box {
      margin-top: 14px;
      background: #f3f4f6;
      padding: 12px;
      border-radius: 12px;
      word-break: break-word;
      font-size: 14px;
    }

    .exit-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      background: #ef4444;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: bold;
      display: none;
    }

    .player-wrapper {
      position: relative;
      width: 24px;
      height: 24px;
    }

    .pulse {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 999px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.5;
      animation: pulseAnim 2s infinite;
    }

    .dot {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 3px solid white;
      box-shadow: 0 0 15px rgba(255,255,255,0.8);
    }

    @keyframes pulseAnim {
      0% {
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 0.8;
      }

      100% {
        transform: translate(-50%, -50%) scale(2);
        opacity: 0;
      }
    }

    .leaflet-popup-content {
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="menu" id="menu">
  <div class="card">
    <h1>GeoGO</h1>
    <p>Pokémon GO style multiplayer map</p>

    <input id="nickname" placeholder="Nickname" maxlength="20" />
    <input id="room" placeholder="Room ID (optional)" />

    <button id="createBtn">Create Room</button>
    <button id="joinBtn">Join Room</button>

    <div class="room-box" id="roomBox">
      No room created yet.
    </div>
  </div>
</div>

<div class="status">
  <div><b>Role:</b> <span id="roleText">-</span></div>
  <div><b>Host:</b> <span id="hostText">-</span></div>
  <div><b>Room:</b> <span id="roomText">-</span></div>
</div>

<button class="exit-btn" id="exitBtn">
  Exit
</button>

<div id="map"></div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
  // =========================
  // MAP
  // =========================

  const map = L.map('map').setView([14.5995, 120.9842], 18);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // =========================
  // UI
  // =========================

  const menu = document.getElementById('menu');
  const nicknameInput = document.getElementById('nickname');
  const roomInput = document.getElementById('room');
  const createBtn = document.getElementById('createBtn');
  const joinBtn = document.getElementById('joinBtn');
  const roomBox = document.getElementById('roomBox');
  const exitBtn = document.getElementById('exitBtn');

  const roleText = document.getElementById('roleText');
  const hostText = document.getElementById('hostText');
  const roomText = document.getElementById('roomText');

  // =========================
  // PLAYER VARIABLES
  // =========================

  let nickname = "";
  let myMarker = null;
  let peer = null;
  let roomId = null;
  let watchId = null;
  let isHost = false;

  const connections = [];
  const players = {};

  let myColor = randomColor();

  // =========================
  // CREATE ROOM
  // =========================

  createBtn.onclick = () => {
    nickname = nicknameInput.value.trim();

    if (!nickname) {
      alert("Please enter a nickname");
      return;
    }

    roomId = generateRoomId();
    isHost = true;

    roomBox.innerHTML = `
      <b>Room Created</b><br><br>
      Share this Room ID:<br><br>
      <b>${roomId}</b>
    `;

    startHost();
  };

  // =========================
  // JOIN ROOM
  // =========================

  joinBtn.onclick = () => {
    nickname = nicknameInput.value.trim();
    roomId = roomInput.value.trim();

    if (!nickname || !roomId) {
      alert("Enter nickname and room ID");
      return;
    }

    startClient();
  };

  // =========================
  // EXIT BUTTON
  // =========================

  exitBtn.onclick = () => {
    location.reload();
  };

  // =========================
  // HOST
  // =========================

  function startHost() {
    peer = new Peer(roomId);

    peer.on('open', () => {
      menu.style.display = 'none';
      exitBtn.style.display = 'block';

      roleText.innerText = "HOST 👑";
      hostText.innerText = nickname;
      roomText.innerText = roomId;

      startGPS();
    });

    peer.on('connection', (conn) => {
      setupConnection(conn);
    });
  }

  // =========================
  // CLIENT
  // =========================

  function startClient() {
    peer = new Peer();

    peer.on('open', () => {
      const conn = peer.connect(roomId);

      conn.on('open', () => {
        setupConnection(conn);

        menu.style.display = 'none';
        exitBtn.style.display = 'block';

        roleText.innerText = "PLAYER 👤";
        roomText.innerText = roomId;

        startGPS();
      });
    });
  }

  // =========================
  // CONNECTION
  // =========================

  function setupConnection(conn) {
    connections.push(conn);

    conn.on('data', (data) => {

      // Show host name to joined users
      if (data.host) {
        hostText.innerText = data.nickname;
      }

      updatePlayer(data);

      // Host rebroadcasts to everyone
      if (isHost) {
        broadcast(data);
      }
    });

    conn.on('close', () => {
      console.log('Disconnected');
    });
  }

  // =========================
  // GPS
  // =========================

  function startGPS() {

    if (!navigator.geolocation) {
      alert("Geolocation unsupported");
      return;
    }

    watchId = navigator.geolocation.watchPosition(

      (position) => {

        const lat = position.coords.latitude;
        const lng = position.coords.longitude;

        updateMe(lat, lng);

        const payload = {
          id: peer.id,
          nickname,
          lat,
          lng,
          color: myColor,
          host: isHost
        };

        broadcast(payload);
      },

      (err) => {
        console.error(err);
        alert("Location permission denied");
      },

      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 5000
      }

    );
  }

  // =========================
  // PLAYER ICON
  // =========================

  function createPlayerIcon(color) {

    return L.divIcon({
      className: '',
      html: `
        <div class="player-wrapper">
          <div class="pulse" style="background:${color}"></div>
          <div class="dot" style="background:${color}"></div>
        </div>
      `,
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

  }

  // =========================
  // UPDATE ME
  // =========================

  function updateMe(lat, lng) {

    map.setView([lat, lng]);

    const icon = createPlayerIcon(myColor);

    if (!myMarker) {

      myMarker = L.marker([lat, lng], { icon })
        .addTo(map)
        .bindPopup(`
          🟢 You<br>
          ${nickname}<br>
          ${isHost ? '👑 Host' : '👤 Player'}
        `);

    } else {

      myMarker.setLatLng([lat, lng]);

    }
  }

  // =========================
  // UPDATE OTHER PLAYERS
  // =========================

  function updatePlayer(data) {

    if (data.id === peer.id) return;

    const icon = createPlayerIcon(data.color);

    if (!players[data.id]) {

      players[data.id] = L.marker(
        [data.lat, data.lng],
        { icon }
      )
      .addTo(map)
      .bindPopup(`
        ${data.host ? '👑 HOST' : '👤 PLAYER'}<br>
        ${data.nickname}
      `);

    } else {

      players[data.id].setLatLng([data.lat, data.lng]);

    }
  }

  // =========================
  // BROADCAST
  // =========================

  function broadcast(data) {

    connections.forEach(conn => {

      if (conn.open) {
        conn.send(data);
      }

    });

  }

  // =========================
  // RANDOM ROOM
  // =========================

  function generateRoomId() {

    return Math.random()
      .toString(36)
      .substring(2, 8)
      .toUpperCase();

  }

  // =========================
  // RANDOM PLAYER COLOR
  // =========================

  function randomColor() {

    const colors = [
      '#3B82F6',
      '#EF4444',
      '#10B981',
      '#F59E0B',
      '#8B5CF6',
      '#EC4899',
      '#06B6D4'
    ];

    return colors[
      Math.floor(Math.random() * colors.length)
    ];

  }

  // =========================
  // CLEANUP
  // =========================

  window.addEventListener('beforeunload', () => {

    if (watchId) {
      navigator.geolocation.clearWatch(watchId);
    }

    if (peer) {
      peer.destroy();
    }

  });

</script>

</body>
</html>
